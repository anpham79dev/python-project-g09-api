version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: artisan_bakery_postgres
    restart: always
    environment:
      POSTGRES_USER: bakery_admin
      POSTGRES_PASSWORD: bakery_password_2026
      POSTGRES_DB: bakery_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bakery_admin -d bakery_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
